<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Container Filled with Deep Forest Ink -->
  <rect width="32" height="32" rx="7" fill="#0E1D18" stroke="rgba(231, 238, 233, 0.14)" stroke-width="1" />

  <!-- Technical Structural Micro-Grid Lines (canopy) -->
  <g stroke="#16302A" stroke-width="0.5">
    <line x1="6" y1="0" x2="6" y2="32" />
    <line x1="26" y1="0" x2="26" y2="32" />
    <line x1="0" y1="26" x2="32" y2="26" />
  </g>

  <!-- Laptop Framework Group Layered with Ochre Accent (signal) -->
  <g fill="none" stroke="#C98A2B" stroke-linecap="round" stroke-linejoin="round">
    <!-- Laptop Display Bezel Shell -->
    <rect x="7" y="7" width="18" height="12" rx="1.5" stroke-width="2" />
    <line x1="7" y1="19" x2="25" y2="19" stroke-width="1.25" opacity="0.4" />
    
    <!-- Keyboard Deck Decking Surface Base -->
    <polygon points="4,23 7,19 25,19 28,23" stroke-width="2" />
    
    <!-- Integrated Trackpad Indicator Element (text-on-ink) -->
    <line x1="14" y1="23" x2="18" y2="23" stroke="#E7EEE9" stroke-width="1.25" />
  </g>

  <!-- Code Bracket Streams Emitting From Display Screen Core (moss) -->
  <g fill="none" stroke="#4C7A63" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 13,11 L 11,13 L 13,15" />
    <path d="M 19,11 L 21,13 L 19,15" />
  </g>
</svg>
