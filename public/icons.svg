<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Technical Cyberpunk Gradient Palette Base -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Electric Core Text Shift -->
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Tech Element Fading Accent -->
    <linearGradient id="fadedGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- Main Rounded Enclosure -->
  <rect width="800" height="400" rx="16" fill="url(#cyberBg)" stroke="#233554" stroke-width="1.5" />

  <!-- Matrix Technical Alignment Grid Lines -->
  <g stroke="#172a45" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="400" />
    <line x1="740" y1="0" x2="740" y2="400" />
    <line x1="0" y1="340" x2="800" y2="340" />
  </g>

  <!-- BACKGROUND OBJECTS: Laptop & Networking Mesh (Right-Aligned Accent) -->
  <g fill="none" stroke="url(#fadedGlow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Interconnected Networking Data Nodes -->
    <g transform="translate(620, 80)">
      <circle cx="0" cy="0" r="5" fill="#172a45" stroke-width="2" />
      <circle cx="60" cy="-40" r="4" fill="#172a45" />
      <circle cx="90" cy="30" r="4" fill="#172a45" />
      <circle cx="30" cy="70" r="5" fill="#172a45" stroke-width="2" />
      
      <!-- Network Routing Signal Vectors -->
      <path d="M 0,0 L 60,-40 L 90,30 L 30,70 L 0,0 Z" />
      <line x1="0" y1="0" x2="90" y2="30" />
    </g>

    <!-- 2. Technical Laptop Wireframe Element -->
    <g transform="translate(480, 150)">
      <!-- Laptop Screen Shell Open -->
      <rect x="20" y="10" width="130" height="85" rx="4" />
      <line x1="20" y1="85" x2="150" y2="85" />
      <!-- Display Camera Indicator -->
      <circle cx="85" cy="15" r="1" />
      
      <!-- Laptop Lower Keyboard Deck Base -->
      <polygon points="10,105 20,95 150,95 160,105" />
      <!-- Trackpad Outline Area -->
      <rect x="70" y="97" width="20" height="6" rx="1" />
      
      <!-- Bus Connection link extending into the Network Matrix -->
      <path d="M 160,102 L 200,102 L 230,70" stroke-dasharray="3 3" />
    </g>
  </g>

  <!-- CENTRAL CODE CORE WORKSPACE (Left Aligned Text Context) -->
  <g transform="translate(90, 0)">
    
    <text x="0" y="115" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#e2e8f0" letter-spacing="-0.5px">
      Kamunyu Raphael
    </text>

    <!-- Sentence 2: Technical Expertise Core Array -->
    <text x="0" y="170" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" font-size="13" fill="url(#neonTeal)" letter-spacing="1.5px">
      SOFTWARE ENGINEER // AIoT · DATA SCIENCE · AI/ML · MERN · TYPESCRIPT
    </text>

    <!-- Micro Tech Separation Path Bar -->
    <path d="M 0,215 L 180,215" stroke="#64ffda" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Sentence 3: Philosophy Core Quote Definition -->
    <text x="0" y="270" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" font-size="15" font-style="italic" fill="#8892b0" letter-spacing="0.2px">
      "Patience doesn't get you what you want, it gets you what you need."
    </text>
  </g>

  <!-- System Watermark Layout Metadata Signature Details -->
  <text x="710" y="370" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#495670" letter-spacing="1px">
    SYS_REF: CLOUD_PORTFOLIO // INTERFACE: SECURE // REPO: SAFIRI_v2.0
  </text>
</svg>
